services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: maie6000c
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Windows: host port 5432 falls inside the Hyper-V reserved range
      # (5357-5657) and cannot be bound; 15432 is outside every reserved range.
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maie6000c"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: .
    command: uvicorn services.ai.app.main:app --host 0.0.0.0 --port 8100
    env_file:
      - .env
    environment:
      AI_SERVICE_URL: http://ai:8100
      EMBEDDING_MODEL_PATH: /models/multilingual-e5-small
    volumes:
      - ./models:/models:ro
    ports:
      - "${AI_HOST_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: /bin/sh -c "alembic upgrade head && uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/maie6000c
      AI_SERVICE_URL: http://ai:8100
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Read-only source mounts (allowlist keys live in services/common/config.py).
      # Exact fixture corpus for the W7 vertical slice: 12 normal PDFs +
      # unsupported.txt + 3 abnormal PDFs = 16 files. The api serves source
      # previews from here; nothing in the stack writes to it.
      # These fixtures are W7 demo data only. A real corpus is mounted at deploy
      # time from wherever the operator keeps it; tests/fixtures is not the
      # product's corpus location and must not become one.
      - ./tests/fixtures/regression:/source/corpus/regression:ro
      - ./tests/fixtures/parsing/corrupt.pdf:/source/corpus/abnormal/corrupt.pdf:ro
      - ./tests/fixtures/parsing/encrypted.pdf:/source/corpus/abnormal/encrypted.pdf:ro
      - ./tests/fixtures/parsing/no_text_layer.pdf:/source/corpus/abnormal/no_text_layer.pdf:ro
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: python -m services.worker.app.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/maie6000c
      AI_SERVICE_URL: http://ai:8100
    volumes:
      # Same read-only source mounts as the api service (W7 demo fixtures, not
      # the product's corpus location - see the note under the api volumes).
      - ./tests/fixtures/regression:/source/corpus/regression:ro
      - ./tests/fixtures/parsing/corrupt.pdf:/source/corpus/abnormal/corrupt.pdf:ro
      - ./tests/fixtures/parsing/encrypted.pdf:/source/corpus/abnormal/encrypted.pdf:ro
      - ./tests/fixtures/parsing/no_text_layer.pdf:/source/corpus/abnormal/no_text_layer.pdf:ro
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The api service does not assemble /mounts, /files, /evidence or
        # /relations yet, so the shipped demo boots in explicit mock mode and
        # shows its SIMULATION banner. Set FRONTEND_DATA_MODE=api once A/B have
        # wired those routes; API failures never fall back to mock on their own.
        VITE_DATA_MODE: ${FRONTEND_DATA_MODE:-mock}
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  postgres_data:
