services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maie6000c
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maie6000c"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: .
    command: uvicorn services.ai.app.main:app --host 0.0.0.0 --port 8100
    env_file:
      - .env
    environment:
      AI_SERVICE_URL: http://ai:8100
    ports:
      - "${AI_HOST_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: /bin/sh -c "alembic upgrade head && uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/maie6000c
      AI_SERVICE_URL: http://ai:8100
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: python -m services.worker.app.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/maie6000c
      AI_SERVICE_URL: http://ai:8100
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  postgres_data:
