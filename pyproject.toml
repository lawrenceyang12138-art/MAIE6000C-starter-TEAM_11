[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maie6000c-starter-template"
version = "0.1.0"
description = "Starter template for MAIE 6000C"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-json-logger==3.3.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[tool.setuptools.packages.find]
include = ["services", "services.*"]

[tool.pytest.ini_options]
markers = [
  "smoke: tests that require a running stack",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
