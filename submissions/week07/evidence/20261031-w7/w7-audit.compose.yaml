services:
  api:
    environment:
      SOURCE_MOUNTS: '{"corpus":"/source/corpus","relations":"/source/relations","scenarios":"/source/scenarios"}'
      API_ALLOWED_ORIGINS: '["http://127.0.0.1:13001","http://localhost:13001","http://127.0.0.1:5178","http://localhost:5178"]'
    volumes:
      - ./tests/fixtures/relations:/source/relations:ro
      - ./work/w7-audit-sources:/source/scenarios:ro
  worker:
    environment:
      SOURCE_MOUNTS: '{"corpus":"/source/corpus","relations":"/source/relations","scenarios":"/source/scenarios"}'
      WORKER_POLL_SECONDS: '0.2'
    volumes:
      - ./tests/fixtures/relations:/source/relations:ro
      - ./work/w7-audit-sources:/source/scenarios:ro
