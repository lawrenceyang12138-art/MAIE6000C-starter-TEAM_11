name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: maie6000c
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maie6000c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maie6000c
      SEARCH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maie6000c
      AI_SERVICE_URL: http://localhost:8100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check .

      - name: Alembic migration
        run: alembic upgrade head

      - name: Unit and integration tests
        run: pytest -q tests/unit tests/integration

      - name: Gold source check
        run: python scripts/validate_d_gold.py

  # D's node-side contract tests and frozen-fixture checks. They need no
  # Python, no database, and no browser; they exercise the same adapters the
  # frontend imports.
  nodescripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node contract tests
        run: node --test scripts/test_d_integration.test.mjs scripts/test_d_search_review.test.mjs scripts/test_startup_browser.test.mjs

      - name: Mock adapter harness
        run: node scripts/test_d_mock.mjs

      - name: Frozen fixture validation
        run: node scripts/validate_d_fixtures.mjs

  # The frontend had no build or test coverage before this job; both are now
  # required for any change that touches frontend/.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vitest
        run: npm test -- --run
